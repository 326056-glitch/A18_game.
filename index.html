<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Typing - Cyberpunk Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-primary: #0ea5e9;
            --neon-success: #22c55e;
            --neon-error: #ef4444;
            --bg-color: #020617;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Noto Sans JP', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .font-mono-typing {
            font-family: 'Fira Code', monospace;
        }

        /* Canvas Background */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* Text Effects */
        .neon-text-title {
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-primary), 0 0 40px var(--neon-primary);
        }

        .neon-text-score {
            color: var(--neon-primary);
            text-shadow: 0 0 10px rgba(14, 165, 233, 0.5);
        }

        .typed {
            color: var(--neon-success);
            text-shadow: 0 0 10px var(--neon-success), 0 0 20px var(--neon-success);
        }

        .untyped {
            color: #475569;
        }

        .cursor-blink {
            display: inline-block;
            width: 12px;
            height: 3px;
            background-color: var(--neon-primary);
            box-shadow: 0 0 8px var(--neon-primary);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 2px;
            margin-bottom: -4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Error Shake Animation */
        .shake-error {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
            color: var(--neon-error) !important;
            text-shadow: 0 0 10px var(--neon-error) !important;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Screen Transitions */
        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .screen.active {
            display: flex;
            opacity: 1;
        }

        /* Button Styling */
        .btn-neon {
            position: relative;
            background: transparent;
            color: var(--neon-primary);
            border: 2px solid var(--neon-primary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .btn-neon:hover {
            background: var(--neon-primary);
            color: #000;
            box-shadow: 0 0 15px var(--neon-primary), 0 0 30px var(--neon-primary);
        }
        
        .combo-text {
            transition: transform 0.1s ease;
        }
        .combo-pop {
            transform: scale(1.3);
            color: #fbbf24;
            text-shadow: 0 0 15px #fbbf24;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- Background Canvas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Start Screen -->
    <div id="start-screen" class="screen active flex-col items-center justify-center w-full max-w-2xl p-8 glass-panel rounded-2xl text-center">
        <h1 class="text-5xl md:text-7xl font-black mb-4 neon-text-title tracking-wider">NEON TYPING</h1>
        <p class="text-slate-400 mb-8 text-lg">サイバーパンク・タイピングエクスペリエンス</p>
        
        <div class="bg-red-900/40 border border-red-500/50 rounded-lg p-4 mb-8 text-red-200">
            <p class="font-bold flex items-center justify-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                ご注意
            </p>
            <p class="text-sm mt-2">プレイする前に、必ず日本語入力(IME)をオフにして<strong>【半角英数】</strong>にしてください。</p>
        </div>

        <button id="start-btn" class="btn-neon font-bold py-4 px-12 rounded-full text-xl cursor-pointer">
            SYSTEM START
        </button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen flex-col w-full max-w-4xl p-6 md:p-12 glass-panel rounded-2xl relative">
        <!-- Header: Stats -->
        <div class="flex justify-between items-start mb-12">
            <div class="flex flex-col">
                <span class="text-slate-400 text-sm font-bold tracking-widest uppercase">Time Left</span>
                <span id="time-display" class="text-5xl font-mono-typing font-bold neon-text-score">60.0</span>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-slate-400 text-sm font-bold tracking-widest uppercase">Score</span>
                <span id="score-display" class="text-5xl font-mono-typing font-bold neon-text-score">0</span>
            </div>
        </div>

        <!-- Main Play Area -->
        <div class="flex flex-col items-center justify-center flex-grow py-8 relative">
            
            <!-- Combo Counter -->
            <div id="combo-display" class="absolute top-0 text-2xl font-black italic text-slate-500 combo-text opacity-0">
                0 COMBO
            </div>

            <div id="word-display-container" class="text-center mt-8 transition-transform duration-100">
                <!-- Japanese Word -->
                <div id="ja-word" class="text-4xl md:text-5xl font-bold mb-6 tracking-widest">
                    準備完了
                </div>
                <!-- Romaji Display -->
                <div id="romaji-word" class="text-5xl md:text-7xl font-mono-typing font-bold tracking-wider flex items-center justify-center">
                    <span class="untyped">ready</span>
                </div>
            </div>
        </div>
        
        <!-- Progress Bar -->
        <div class="w-full bg-slate-800 h-2 rounded-full mt-12 overflow-hidden">
            <div id="time-bar" class="bg-sky-500 h-full w-full transition-all duration-100" style="box-shadow: 0 0 10px #0ea5e9;"></div>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="screen flex-col items-center justify-center w-full max-w-2xl p-8 md:p-12 glass-panel rounded-2xl text-center">
        <h2 class="text-4xl md:text-5xl font-black mb-2 text-white tracking-widest uppercase">Mission Complete</h2>
        
        <div class="my-8 w-full bg-slate-900/50 rounded-xl p-8 border border-slate-700">
            <div class="text-6xl font-black mb-2" id="rank-display" style="color: #fbbf24; text-shadow: 0 0 20px #fbbf24;">S RANK</div>
            
            <div class="grid grid-cols-2 gap-6 mt-8 text-left max-w-sm mx-auto">
                <div class="text-slate-400 uppercase text-sm font-bold">Total Score</div>
                <div class="text-2xl font-mono-typing font-bold text-right" id="final-score">0</div>
                
                <div class="text-slate-400 uppercase text-sm font-bold">Max Combo</div>
                <div class="text-2xl font-mono-typing font-bold text-right" id="final-combo">0</div>
                
                <div class="text-slate-400 uppercase text-sm font-bold">Accuracy</div>
                <div class="text-2xl font-mono-typing font-bold text-right" id="final-accuracy">0%</div>
            </div>
        </div>

        <button id="restart-btn" class="btn-neon font-bold py-4 px-12 rounded-full text-xl cursor-pointer mt-4">
            REBOOT SYSTEM
        </button>
    </div>

    <!-- Game Logic -->
    <script>
        /* --- Word Dictionary --- */
        const words = [
            { ja: "未来", romaji: "mirai" },
            { ja: "世界", romaji: "sekai" },
            { ja: "希望", romaji: "kibou" },
            { ja: "夢", romaji: "yume" },
            { ja: "光", romaji: "hikari" },
            { ja: "風", romaji: "kaze" },
            { ja: "水", romaji: "mizu" },
            { ja: "炎", romaji: "honoo" },
            { ja: "大地", romaji: "daichi" },
            { ja: "空", romaji: "sora" },
            { ja: "星空", romaji: "hoshizora" },
            { ja: "宇宙", romaji: "uchuu" },
            { ja: "進化", romaji: "shinka" },
            { ja: "革命", romaji: "kakumei" },
            { ja: "誕生", romaji: "tanjou" },
            { ja: "永遠", romaji: "eien" },
            { ja: "共鳴", romaji: "kyoumei" },
            { ja: "奇跡", romaji: "kiseki" },
            { ja: "神話", romaji: "shinwa" },
            { ja: "流星", romaji: "ryuusei" },
            { ja: "幻想", romaji: "gensou" },
            { ja: "調和", romaji: "chouwa" },
            { ja: "情熱", romaji: "jounetsu" },
            { ja: "運命", romaji: "unmei" },
            { ja: "覚醒", romaji: "kakusei" },
            { ja: "無限", romaji: "mugen" },
            { ja: "絶対", romaji: "zettai" },
            { ja: "真実", romaji: "shinjitsu" },
            { ja: "魂", romaji: "tamashii" },
            { ja: "仮想現実", romaji: "kasougenjitsu" },
            { ja: "人工知能", romaji: "jinkouchinou" },
            { ja: "ネットワーク", romaji: "nettowa-ku" },
            { ja: "システム", romaji: "shisutemu" },
            { ja: "プログラム", romaji: "puroguramu" }
        ];

        /* --- Game State --- */
        let currentWord = null;
        let currentTypedIndex = 0;
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let totalKeystrokes = 0;
        let correctKeystrokes = 0;
        
        const GAME_DURATION = 60;
        let timeLeft = GAME_DURATION;
        let deadline = 0;
        let timerInterval = null;
        let isPlaying = false;

        /* --- Audio Context --- */
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'correct') {
                osc.type = 'sine';
                // Pitch rises slightly based on combo
                const baseFreq = 600 + Math.min(combo * 20, 400);
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(baseFreq + 200, now + 0.05);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.1);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.linearRampToValueAtTime(0.001, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'finish') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0.001, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        /* --- DOM Elements --- */
        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            result: document.getElementById('result-screen')
        };
        const displays = {
            time: document.getElementById('time-display'),
            score: document.getElementById('score-display'),
            ja: document.getElementById('ja-word'),
            romaji: document.getElementById('romaji-word'),
            wordContainer: document.getElementById('word-display-container'),
            timeBar: document.getElementById('time-bar'),
            combo: document.getElementById('combo-display')
        };

        /* --- Core Logic --- */
        function switchScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[screenName].classList.add('active');
        }

        function spawnWord() {
            const nextWord = words[Math.floor(Math.random() * words.length)];
            // Prevent same word twice in a row if possible
            if(currentWord && currentWord.romaji === nextWord.romaji) {
                spawnWord();
                return;
            }
            currentWord = nextWord;
            currentTypedIndex = 0;
            updateWordDisplay();
            displays.ja.classList.add('opacity-0');
            setTimeout(() => {
                displays.ja.classList.remove('opacity-0');
                displays.ja.innerText = currentWord.ja;
            }, 100);
        }

        function updateWordDisplay() {
            if (!currentWord) return;
            const typedStr = currentWord.romaji.substring(0, currentTypedIndex);
            const untypedStr = currentWord.romaji.substring(currentTypedIndex);
            
            let html = '';
            if (typedStr.length > 0) {
                html += `<span class="typed">${typedStr}</span>`;
            }
            if (untypedStr.length > 0) {
                html += `<span class="cursor-blink"></span><span class="untyped">${untypedStr}</span>`;
            }
            displays.romaji.innerHTML = html;
        }

        function updateComboDisplay() {
            if (combo > 1) {
                displays.combo.innerText = `${combo} COMBO!`;
                displays.combo.style.opacity = 1;
                displays.combo.classList.remove('combo-pop');
                void displays.combo.offsetWidth; // Trigger reflow
                displays.combo.classList.add('combo-pop');
                
                // Color scaling based on combo
                if (combo > 20) displays.combo.style.color = '#f43f5e'; // Rose
                else if (combo > 10) displays.combo.style.color = '#a855f7'; // Purple
                else displays.combo.style.color = '#0ea5e9'; // Blue
                
            } else {
                displays.combo.style.opacity = 0;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            if (!updateTimer()) return;
            
            // Ignore system keys (Ctrl, Alt, Meta, Shift, Tab, etc)
            if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
            
            // Only process alphabetical characters and hyphens
            if (!/^[a-zA-Z\-]$/.test(e.key)) return;

            e.preventDefault(); // Prevent accidental browser shortcuts just in case
            totalKeystrokes++;

            const targetChar = currentWord.romaji[currentTypedIndex].toLowerCase();
            const inputChar = e.key.toLowerCase();

            if (inputChar === targetChar) {
                // Correct Type
                currentTypedIndex++;
                correctKeystrokes++;
                combo++;
                if (combo > maxCombo) maxCombo = combo;
                
                // Calculate score: Base 10 + combo bonus
                const points = 10 + Math.floor(combo * 1.5);
                score += points;
                
                playSound('correct');
                updateWordDisplay();
                updateComboDisplay();
                displays.score.innerText = score;

                // Word finished
                if (currentTypedIndex === currentWord.romaji.length) {
                    playSound('finish');
                    score += 50; // Completion bonus
                    displays.score.innerText = score;
                    spawnWord();
                }
            } else {
                // Wrong Type
                combo = 0;
                updateComboDisplay();
                playSound('wrong');
                
                // Visual feedback
                displays.wordContainer.classList.remove('shake-error');
                void displays.wordContainer.offsetWidth; // trigger reflow
                displays.wordContainer.classList.add('shake-error');
            }
        });

        /* --- Game Loop & Timer --- */
        function startGame() {
            initAudio();
            clearInterval(timerInterval);
            score = 0;
            combo = 0;
            maxCombo = 0;
            totalKeystrokes = 0;
            correctKeystrokes = 0;
            timeLeft = GAME_DURATION;
            deadline = performance.now() + GAME_DURATION * 1000;
            isPlaying = true;
            
            displays.score.innerText = score;
            displays.time.innerText = timeLeft.toFixed(1);
            displays.timeBar.style.width = '100%';
            displays.combo.style.opacity = 0;

            switchScreen('game');
            spawnWord();

            timerInterval = setInterval(updateTimer, 100);
        }

        function updateTimer() {
            if (!isPlaying) return false;
            // Timer callbacks can be delayed; the deadline remains the same.
            timeLeft = Math.max(0, (deadline - performance.now()) / 1000);
            displays.time.innerText = timeLeft.toFixed(1);
            displays.timeBar.style.width = `${(timeLeft / GAME_DURATION) * 100}%`;

            // Change bar color when time is low
            if (timeLeft < 10) {
                displays.timeBar.style.backgroundColor = '#ef4444'; // Red
                displays.timeBar.style.boxShadow = '0 0 10px #ef4444';
            } else {
                displays.timeBar.style.backgroundColor = '#0ea5e9'; // Blue
                displays.timeBar.style.boxShadow = '0 0 10px #0ea5e9';
            }

            if (timeLeft === 0) {
                endGame();
                return false;
            }
            return true;
        }

        function endGame() {
            if (!isPlaying) return;
            isPlaying = false;
            clearInterval(timerInterval);
            timerInterval = null;
            
            // Calculate Stats
            const accuracy = totalKeystrokes > 0 ? Math.round((correctKeystrokes / totalKeystrokes) * 100) : 0;
            
            // Determine Rank
            let rank = 'D';
            let rankColor = '#94a3b8';
            if (score >= 6000) { rank = 'SSS'; rankColor = '#fbbf24'; }
            else if (score >= 4500) { rank = 'S'; rankColor = '#fcd34d'; }
            else if (score >= 3000) { rank = 'A'; rankColor = '#4ade80'; }
            else if (score >= 1500) { rank = 'B'; rankColor = '#60a5fa'; }
            else if (score >= 500) { rank = 'C'; rankColor = '#c084fc'; }
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-combo').innerText = maxCombo;
            document.getElementById('final-accuracy').innerText = `${accuracy}%`;
            
            const rankEl = document.getElementById('rank-display');
            rankEl.innerText = `${rank} RANK`;
            rankEl.style.color = rankColor;
            rankEl.style.textShadow = `0 0 20px ${rankColor}`;

            switchScreen('result');
        }

        /* --- Event Listeners --- */
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        /* --- Canvas Particle Background System --- */
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                // Cyberpunk colors: cyan, magenta, blue
                const colors = ['#0ea5e9', '#8b5cf6', '#3b82f6'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                if (this.x > canvas.width) this.x = 0;
                else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                else if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Add glow to slightly larger particles
                if(this.size > 1.5) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                } else {
                    ctx.shadowBlur = 0;
                }
            }
        }

        function initParticles() {
            particles = [];
            const numParticles = Math.min(window.innerWidth / 10, 150); // Scale with screen size
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
